[workspace]
resolver = "2"
members = [
    "crates/nms-core",
    "crates/nms-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NMS Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
tokio-cron-scheduler = "0.13"
uuid = { version = "1.10", features = ["v4"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
jsonwebtoken = "9.3"
getrandom = "0.2"
base64 = "0.22"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "macros", "chrono"] }
serde_yaml = "0.9"
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
sha1 = "0.10"
hmac = "0.12"
data-encoding = "2.6"
chrono = "0.4"
urlencoding = "2.1"
toml = "0.8"
wasmtime = { version = "47.0", features = ["component-model", "async"] }
wasmtime-wasi = "47.0"
zip = "8.6"
semver = "1.0"
jsonschema = "0.49"
ed25519-dalek = "3.0"

